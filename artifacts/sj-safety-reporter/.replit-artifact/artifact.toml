kind = "web"
previewPath = "/"
title = "CIVICCLEAR"
description = "A browser-only class prototype for AI-assisted civic reporting, highlighting missing information for a demo human reviewer. Not an official City of San José service."
version = "1.0.0"
id = "artifacts/sj-safety-reporter"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21576

[services.development]
run = "pnpm --filter @workspace/sj-safety-reporter run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sj-safety-reporter", "run", "build" ]
serve = "static"
publicDir = "artifacts/sj-safety-reporter/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21576"
BASE_PATH = "/"